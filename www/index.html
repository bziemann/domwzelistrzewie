<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dom w 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="vendor/fonts/manrope.css">
<style>
/* Layout: pełnoekranowy model 3D; ekrany 2D (kondygnacje, rzut pomieszczenia, uwagi) przykrywają go jako warstwy */
:root{--bg:#E9EDF1;--panel:#FFFFFF;--fg:#1E2430;--muted:#556070;--accent:#1F3A5F;--accent-fg:#FFFFFF;--line:#D3DAE3;--focus:#C8382E;--floor:#F7F3EC;--item:#FFFFFF;--sel:#C8382E;--win:#4F86BC;--slope:#D3DBE5;--room:#DCE6F0;--room-h:#BFD2E6;--wall:#2B3038;--font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151B;--panel:#1B2129;--fg:#E7EBF0;--muted:#A6B0BC;--accent:#8FB3DD;--accent-fg:#0E1420;--line:#2D3541;--focus:#F07A70;--floor:#1E242C;--item:#28303A;--sel:#F07A70;--win:#7FB0DD;--slope:#2E3946;--room:#24303D;--room-h:#2F4359;--wall:#C9D1DB;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151B;--panel:#1B2129;--fg:#E7EBF0;--muted:#A6B0BC;--accent:#8FB3DD;--accent-fg:#0E1420;--line:#2D3541;--focus:#F07A70;--floor:#1E242C;--item:#28303A;--sel:#F07A70;--win:#7FB0DD;--slope:#2E3946;--room:#24303D;--room-h:#2F4359;--wall:#C9D1DB;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#app{position:relative;height:100%}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
button{font-family:var(--font)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.ttl{font-size:15px;margin:0;font-weight:800;background:var(--panel);padding:9px 12px;border-radius:8px;border:1px solid var(--line);text-wrap:balance}
.back{font:700 13px var(--font);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px;cursor:pointer}
.grp{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 3px 3px 10px;flex-wrap:wrap}
.grp span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grp button{font:700 13px var(--font);border:0;background:transparent;color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:36px}
.grp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.help{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(360px,calc(100% - 200px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:4px;z-index:4}
.help strong{color:var(--fg)}
.pad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;z-index:4}
.pad button{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--accent);color:var(--accent-fg)}
.pad svg{width:20px;height:20px}
@media (max-width:560px){.help{max-width:calc(100% - 200px);font-size:11px}.help .long{display:none}}
/* ekrany 2D */
.layer{position:absolute;inset:0;background:var(--bg);overflow:auto;box-sizing:border-box;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:3}
.home-in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:max(28px,env(safe-area-inset-top,0px))}
.home-in h1{margin:0;font-size:30px;font-weight:800;color:var(--accent);text-wrap:balance}
.home-in .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font:500 14px var(--font)}
.card:hover{border-color:var(--accent)}
.card strong{font-size:20px;font-weight:800}
.card .meta{color:var(--muted);font-variant-numeric:tabular-nums}
.card svg{width:100%;height:auto;display:block}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:700 14px var(--font);background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.fwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.fsvg{flex:1 1 560px;min-width:0;max-width:1100px}
.fsvg svg{display:block;width:100%;height:auto;font-family:var(--font)}
.side{flex:0 1 300px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.side h2{margin:0;font-size:17px;text-wrap:balance}
.side h3{margin:4px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.side dt{color:var(--muted)}
.side dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
.side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.side p{margin:0;color:var(--muted)}
.side .rl button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:transparent;border:0;border-radius:6px;padding:7px 8px;color:var(--fg);font:600 14px var(--font);cursor:pointer}
.side .rl button:hover{background:var(--room)}
.side .rl small{color:var(--muted);font-weight:600}
.side .btn2{align-self:flex-start;font:700 13px var(--font);border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:36px}
.f-room{fill:var(--room);stroke:none;cursor:pointer}
.f-room:hover,.f-room:focus-visible{fill:var(--room-h)}
.f-room.det{fill:var(--room-h)}
.f-wall{fill:var(--wall)}
.f-lab{fill:var(--fg);font-size:22px;font-weight:800;pointer-events:none}
.f-lab2{fill:var(--muted);font-size:16px;font-weight:600;pointer-events:none;font-variant-numeric:tabular-nums}
.f-st{fill:none;stroke:var(--muted);stroke-width:1.2}
.f-tag{fill:var(--sel);font-size:14px;font-weight:800;pointer-events:none}
/* rzut pomieszczenia */
.p-fill{fill:var(--floor)}
.p-slope1{fill:var(--slope);opacity:.9}
.p-slope2{fill:var(--slope);opacity:.45}
.p-wall{fill:none;stroke:var(--fg);stroke-width:4}
.p-gap{stroke:var(--bg);stroke-width:6}
.p-leaf{stroke:var(--fg);stroke-width:2}
.p-swing{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.p-win{stroke:var(--win);stroke-width:6}
.p-it rect,.p-it circle{fill:var(--item);stroke:var(--accent);stroke-width:1.5;cursor:pointer}
.p-it.p-floor rect{fill:var(--slope);fill-opacity:.5;stroke-dasharray:5 3}
.p-it:hover rect{stroke-width:2.5}
.p-it.sel rect{stroke:var(--sel);stroke-width:3}
.p-it:focus{outline:none}
.p-it:focus-visible rect{stroke:var(--sel);stroke-width:3;stroke-dasharray:3 2}
.p-lab{fill:var(--fg);font-size:10px;font-weight:700;pointer-events:none}
.p-lab2{fill:var(--muted);font-size:9px;pointer-events:none;font-variant-numeric:tabular-nums}
.p-dim{fill:none;stroke:var(--muted);stroke-width:.8}
.p-dim-t{fill:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
.p-gapd{fill:none;stroke:var(--sel);stroke-width:1.4}
.p-gapd-t{fill:var(--sel);font-size:10px;font-weight:700;paint-order:stroke;stroke:var(--floor);stroke-width:3px}
.p-ghost rect{fill:var(--item);stroke:var(--line);stroke-width:1}
.p-ghost text{fill:var(--muted);font-size:8px}
.e-pt{cursor:pointer}
.e-pt circle,.e-pt rect{stroke:var(--panel);stroke-width:1.5}
.e-pt text{fill:#FFFFFF;font-size:7px;font-weight:800;pointer-events:none}
.e-pt.sel circle,.e-pt.sel rect{stroke:var(--fg);stroke-width:2.5}
.e-pt:focus{outline:none}
.e-pt:focus-visible circle,.e-pt:focus-visible rect{stroke:var(--fg);stroke-width:2.5}
.e-lead{stroke:var(--muted);stroke-width:.7}
.legend{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;gap:8px;align-items:flex-start}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;margin-top:4px}
.notes-in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px;line-height:1.55;font-size:15px}
.notes-in h1{font-size:24px;margin:0;text-wrap:balance}
.notes-in h2{margin:0 0 6px;font-size:17px;color:var(--accent);text-wrap:balance}
.notes-in section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.notes-in section.warn{border:2px solid var(--sel)}
.notes-in ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.notes-in .lead{color:var(--muted);margin:0}
.chk{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px;font:700 13px var(--font);box-sizing:border-box}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}body{font-size:14px}</style>
</head>
<body>


<div id="app">
<canvas id="c" aria-label="Model 3D domu" role="img"></canvas>

<div class="bar" id="bar" hidden>
  <button class="back" id="backBtn" type="button">← Wróć</button>
  <h1 class="ttl" id="ttl">Dom</h1>
  <div class="grp" role="group" aria-label="Wariant" id="varGrp"><span>Wariant</span><button id="vA" aria-pressed="true">A</button><button id="vB" aria-pressed="false">B</button></div>
  <div class="grp" role="group" aria-label="Widok" id="viewGrp"><span>Widok</span><button id="mW" aria-pressed="false">Spacer</button><button id="mO" aria-pressed="false">Z góry</button><button id="mP" aria-pressed="false">Rzut 2D</button><button id="mE" aria-pressed="false">Instalacje</button><button id="mN" aria-pressed="false">Uwagi</button></div>
  <div class="grp" role="group" aria-label="Szafy" id="wGrp"><span>Szafy</span><button id="wO" aria-pressed="false">Otwórz</button></div>
  <div class="grp" role="group" aria-label="Wysokość oczu" id="eyeGrp"><span>Oczy</span><button id="eK" aria-pressed="false">Dziecko</button><button id="eD" aria-pressed="true">Dorosły</button></div>
</div>
<div class="help" id="help" hidden></div>
<div class="pad" id="pad" hidden aria-label="Sterowanie ruchem">
<span></span><button data-k="f" aria-label="Do przodu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l7 9H5z" fill="currentColor"/></svg></button><span></span>
<button data-k="l" aria-label="W lewo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l9-7v14z" fill="currentColor"/></svg></button><span></span>
<button data-k="r" aria-label="W prawo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12l-9 7V5z" fill="currentColor"/></svg></button>
<span></span><button data-k="b" aria-label="Do tyłu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19l-7-9h14z" fill="currentColor"/></svg></button><span></span>
</div>

<section class="layer" id="home">
  <div class="home-in">
    <h1>Dom — model kondygnacji</h1>
    <p class="lead">Wybierz kondygnację, a potem pomieszczenie. Model odtworzony z projektu architektonicznego; pokój 1.08 jest już zaprojektowany, pozostałe pokazują szkic mebli z rysunku architekta.</p>
    <div class="cards" id="cards"></div>
    <div class="row"><button class="btn" id="walkAll" type="button">Spacer po całym domu</button><button class="btn sec" id="houseNotes" type="button">Uwagi do modelu</button></div>
  </div>
</section>

<section class="layer" id="floor" hidden>
  <div class="row" style="padding-top:12px;padding-bottom:12px;align-items:center">
    <button class="back" id="floorBack" type="button">← Kondygnacje</button>
    <h1 class="ttl" id="floorTtl">Parter</h1>
    <label class="chk"><input type="checkbox" id="underChk" checked> Podkład z projektu</label>
    <button class="btn" id="floorWalk" type="button">Spacer</button>
    <button class="btn sec" id="floorOrbit" type="button">Widok 3D z góry</button>
  </div>
  <div class="fwrap"><div class="fsvg"><svg id="floorSvg" role="group" aria-label="Rzut kondygnacji"></svg></div><aside class="side" id="floorSide"></aside></div>
</section>

<section class="layer" id="plan" hidden>
  <div class="fwrap"><div class="fsvg"><svg id="planSvg" role="group" aria-label="Rzut pomieszczenia z wymiarami w centymetrach"></svg></div><aside class="side" id="info" aria-live="polite"></aside></div>
</section>

<section class="layer" id="notes" hidden><div class="notes-in" id="notesIn"></div></section>
</div>

<script src="vendor/three.min.js"></script>
<script src="data/house.js"></script>
<script src="js/room-builder.js"></script>
<script src="js/app.js"></script>

</body>
</html>
